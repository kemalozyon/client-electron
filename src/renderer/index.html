<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Collab IDE</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

         connect-src: websocket bağlantısına açıkça izin vermek zorundayız,
         yoksa ws://localhost:8000/ws/... engellenir (SPEC §5.1). ws://localhost:5173
         ise Vite'ın dev sunucusundaki HMR kanalı.

         script-src'deki 'unsafe-inline'/'unsafe-eval': Vite dev sunucusu
         React Fast Refresh preamble'ını index.html'e satır içi <script> olarak
         enjekte ediyor. Hedef deneyim 'npm run dev' olduğu için (SPEC §1)
         bunlara izin veriyoruz.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:8000 ws://localhost:5173"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
