<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Collab IDE</title>
    <!-- https://developer.mozilla.org/en-US/docs/Web/HTTP/CSP

         connect-src: websocket bağlantısına açıkça izin vermek zorundayız,
         yoksa wss://.../ws/documents/... engellenir. 'self' Vite dev
         sunucusunun HMR kanalını da kapsıyor.

         Burada origin LİSTESİ yok, ŞEMA izni var — ve bu bir gevşetme değil,
         zorunluluk. Sunucu adresi artık çalışma zamanında değişiyor
         (main/config.ts): kullanıcı ayarı UI'dan giriyor, çünkü trycloudflare
         alan adı tünel her yeniden başladığında yenileniyor. Bir <meta> CSP'sini
         main'den GENİŞLETMEK mümkün değil — birden çok politika kısıtlayıcı
         şekilde birleşir, yani bir başlık ancak buradakiyle KESİŞİR. Üretimde
         index.html'i yeniden yazmak da asar'ın içine yazmak demek.

         BURAYA BİR http:// YA DA https:// ŞEMASI/ORIGIN'İ GİRMEYİN
         (SPEC_FRONT §4.1). Backend'de CORSMiddleware yok, bu yüzden REST main
         process'te — Node'un fetch'i CORS'a tabi değil. WebSocket upgrade'i
         zaten muaf olduğu için soket renderer'da kalabiliyor. Bu satırda bir
         http(s) şeması belirmesi REST'in renderer'a sızdığının işareti;
         düzeltilecek yer burası değil. Kural artık origin düzeyinde
         gözle denetlenemediği için ŞEMA düzeyinde duruyor.

         script-src'deki 'unsafe-inline'/'unsafe-eval': Vite dev sunucusu
         React Fast Refresh preamble'ını index.html'e satır içi <script> olarak
         enjekte ediyor.

         BU İKİSİNİ ÜRETİM İÇİN KALDIRMAYA ÇALIŞMAYIN. Üretim paketinin ikisine
         de ihtiyacı olmadığı doğru — derlenmiş index.html'de tek bir HARİCİ
         module script var ve bundle'da sıfır `eval(` / `new Function` geçiyor —
         ama bu <meta> etiketi İKİ MODA birden hizmet ediyor ve dev'de o satır
         içi preamble olmadan uygulama hiç açılmıyor. Moda göre farklı politika
         istiyorsanız index.html'i şablonlamanız gerekir; kazanç, kazanılan
         yerin dev'i bozma riskine değmiyor.

         style-src'deki 'unsafe-inline' ise HER İKİ modda da zorunlu: CodeMirror
         temalarını StyleModule ile çalışma zamanında <style> olarak enjekte
         ediyor. Kaldırmak paketlenmiş uygulamada editörün biçimini bozar.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:"
    />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
